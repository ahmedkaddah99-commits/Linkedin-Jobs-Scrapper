name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - deployment/render-turso-r2

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-linux.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements-linux.txt "pytest>=9,<10" "ruff>=0.8,<1.0"

      - name: Lint backend
        run: python -m ruff check backend tests workspace_runner.py

      - name: Run backend checks
        run: >-
          python -m pytest -q
          tests/test_backend_application.py
          tests/test_sqlite_repositories.py
          tests/test_worker_service.py
          tests/test_phase0_contracts.py
          tests/test_job_dedupe.py

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Test API URL resolution
        run: node --test frontend/src/lib/api.test.js

      - name: Lint and build frontend
        run: npm --prefix frontend run check

  docker:
    name: Docker build
    runs-on: ubuntu-24.04
    needs:
      - backend
      - frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
