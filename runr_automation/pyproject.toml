[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "runr-local-automation"
version = "0.1.0"
description = "Local Linear-driven engineering automation for Runr"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["PyYAML>=6,<7"]

[project.scripts]
runr-auto = "runr_automation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
