<!doctype html>
<!--
  Sanitized smartrecruiters application fixture.

  Reproduces the control mix and labelling of a real smartrecruiters application form so
  provider support is proven by inspection and filling, not by URL detection.
  Employer, job, and identifiers are fictional; no candidate data appears here.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Product Designer | Application</title>
    <meta property="og:title" content="Product Designer" />
    <meta property="og:site_name" content="Northwind Industries" />
  </head>
  <body>
    <main class="sr-application">
      <h1>Product Designer</h1>
      <form id="application">
        <label for="firstName">First name *</label>
        <input id="firstName" name="firstName" type="text" required />
        <label for="lastName">Last name *</label>
        <input id="lastName" name="lastName" type="text" required />
        <label for="email">Email *</label>
        <input id="email" name="email" type="email" required />
        <label for="phoneNumber">Phone number</label>
        <input id="phoneNumber" name="phoneNumber" type="tel" />
        <label for="location">Location</label>
        <input id="location" name="location" type="text" />

        <label for="resume">Resume/CV *</label>
        <input id="resume" name="resume" type="file" accept=".pdf,.doc,.docx" required />

        <label for="cover-letter">Cover Letter</label>
        <input id="cover-letter" name="cover_letter" type="file" accept=".pdf,.doc,.docx" />

        <label for="work-auth">Are you authorized to work in this country? *</label>
        <select id="work-auth" name="work_authorization" required>
          <option value="">Select an option</option>
          <option value="yes">Yes</option>
          <option value="no">No</option>
        </select>

        <label for="why">Why are you interested in this role?</label>
        <textarea id="why" name="why"></textarea>

        <button type="submit" id="send">Submit application</button>
      </form>
    </main>
  </body>
</html>
