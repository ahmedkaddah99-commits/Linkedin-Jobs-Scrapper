<!doctype html>
<html lang="en" data-runr-assisted-apply-fixture="lever">
  <head><meta charset="UTF-8"><title>Lever application fixture</title></head>
  <body data-submit-clicks="0" data-native-events=""><form class="application-form">
    <label>Full name <input name="name" autocomplete="name" required></label>
    <label>Email <input name="email" type="email" autocomplete="email" required></label>
    <label>Phone <input name="phone" type="tel" autocomplete="tel" required></label>
    <label for="lever-summary">Professional summary</label><textarea id="lever-summary" name="summary" required></textarea>
    <label for="lever-country">Country</label><select id="lever-country" name="country" required>
      <option value="">Choose</option><option value="DE">Germany</option><option value="GB">United Kingdom</option>
    </select>
    <fieldset><legend>Work authorization</legend>
      <label for="lever-work-yes">Yes</label><input id="lever-work-yes" name="work_authorization" type="radio" value="yes" required>
      <label for="lever-work-no">No</label><input id="lever-work-no" name="work_authorization" type="radio" value="no">
    </fieldset>
    <label for="lever-remote">Open to remote work</label><input id="lever-remote" name="remote" type="checkbox" value="yes">
    <label for="lever-start-date">Start date</label><input id="lever-start-date" name="start_date" type="date" required>
    <label for="lever-employee-code">Employee code</label><input id="lever-employee-code" name="employee_code" pattern="[A-Z]{3}" required>
    <button id="submit" type="submit">Submit application</button>
  </form><script>
    for (const controlId of ["lever-summary", "lever-country", "lever-work-yes", "lever-remote", "lever-start-date"]) {
      const control = document.getElementById(controlId);
      for (const eventName of ["focus", "input", "change", "blur"]) {
        control.addEventListener(eventName, () => {
          document.body.dataset.nativeEvents = [document.body.dataset.nativeEvents, `${controlId}:${eventName}`].filter(Boolean).join(",");
        });
      }
    }
    document.querySelector("form").addEventListener("submit", (event) => {
      event.preventDefault();
      document.body.dataset.submitClicks = String(Number(document.body.dataset.submitClicks || "0") + 1);
    });
  </script></body>
</html>
