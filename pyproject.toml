[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: tests that are useful but not part of the fast local check",
  "external: tests that require external services or credentials",
]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
  ".venv",
  "node_modules",
  "frontend/node_modules",
  "frontend/dist",
  "backend/config/outputs",
  "generated_docs",
  "Archive",
  "Jobs-Urls",
  "test CV",
  "test-CV",
  "user_config/profile_photos",
  "user_config/candidate_assets",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
