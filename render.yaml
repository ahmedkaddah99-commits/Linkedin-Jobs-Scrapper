previews:
  generation: automatic
  expireAfterDays: 3

services:
  - type: web
    name: runr-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_API_EXTERNAL_HOSTNAME
        fromService:
          type: web
          name: runr-api
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: runr-api
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerCommand: ./deploy/start.sh api
    preDeployCommand: ./deploy/start.sh migrate
    healthCheckPath: /health/live
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 60
    envVars:
      - key: RUNR_ENV
        value: production
      - key: DATABASE_BACKEND
        value: turso
      - key: RUNR_STORAGE_BACKEND
        value: sqlite
      - key: RUNR_DATA_DIR
        value: .backend_data
      - key: BACKEND_ALLOWED_ORIGINS
        value: https://runr-frontend.onrender.com,https://app.userunr.com
      - key: RUNR_ASSISTED_APPLY_EXTENSION_ORIGINS
        sync: false
      - key: RENDER_FRONTEND_EXTERNAL_HOSTNAME
        fromService:
          type: web
          name: runr-frontend
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: OBJECT_STORAGE_BACKEND
        value: r2
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: CREEM_API_KEY
        sync: false
      - key: CREEM_WEBHOOK_SECRET
        sync: false
      - key: CREEM_LAUNCH_PRODUCT_ID
        sync: false
      - key: CREEM_MOMENTUM_PRODUCT_ID
        sync: false
      - key: CREEM_SCALE_PRODUCT_ID
        sync: false
      - key: SCRAPEOPS_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: TRACKER_GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: TRACKER_GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: TRACKER_GOOGLE_OAUTH_REDIRECT_URI
        sync: false

  - type: worker
    name: runr-worker
    runtime: docker
    plan: standard
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerCommand: ./deploy/start.sh worker
    autoDeployTrigger: commit
    previews:
      plan: starter
    maxShutdownDelaySeconds: 300
    envVars:
      - key: RUNR_ENV
        value: production
      - key: DATABASE_BACKEND
        value: turso
      - key: RUNR_STORAGE_BACKEND
        value: sqlite
      - key: RUNR_DATA_DIR
        value: .backend_data
      - key: WORKER_ID
        value: render_worker
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: OBJECT_STORAGE_BACKEND
        value: r2
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: SCRAPEOPS_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
