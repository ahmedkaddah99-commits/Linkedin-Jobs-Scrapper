services:
  - type: web
    name: runr-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: runr-api
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerCommand: ./deploy/start.sh api
    preDeployCommand: ./deploy/start.sh migrate
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 60
    envVars:
      - key: RUNR_ENV
        value: production
      - key: DATABASE_BACKEND
        value: turso
      - key: RUNR_STORAGE_BACKEND
        value: sqlite
      - key: RUNR_DATA_DIR
        value: .backend_data
      - key: BACKEND_ALLOWED_ORIGINS
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: OBJECT_STORAGE_BACKEND
        value: r2
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: LEMONSQUEEZY_API_KEY
        sync: false
      - key: LEMONSQUEEZY_WEBHOOK_SECRET
        sync: false
      - key: LEMONSQUEEZY_STORE_ID
        sync: false
      - key: SCRAPEOPS_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TRACKER_GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: TRACKER_GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: TRACKER_GOOGLE_OAUTH_REDIRECT_URI
        sync: false

  - type: cron
    name: runr-process-next
    runtime: docker
    plan: starter
    region: frankfurt
    schedule: "*/5 * * * *"
    dockerfilePath: ./Dockerfile
    dockerCommand: ./deploy/start.sh process-next
    autoDeployTrigger: checksPass
    envVars:
      - key: RUNR_ENV
        value: production
      - key: DATABASE_BACKEND
        value: turso
      - key: RUNR_STORAGE_BACKEND
        value: sqlite
      - key: RUNR_DATA_DIR
        value: .backend_data
      - key: WORKER_ID
        value: render_cron
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: OBJECT_STORAGE_BACKEND
        value: r2
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: SCRAPEOPS_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
